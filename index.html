<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Habit Breaking Tracker</title>
  <button onclick="toggleDarkMode()">🌙Dark Mode</button>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🚫 Habit Breaking Tracker</h1>

    <!-- Add Habit -->
    <div class="input-section">
      <input type="text" id="habitInput" placeholder="Enter habit to quit...">
      <button onclick="addHabit()">Add Habit</button>
    </div>

    <!-- Habit List -->
    <div id="habitList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
