<!DOCTYPE html>
<html>
<head>
  <title>Break Your Limits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div id="homeHeader">
    <h1>⚡ Break Your Limits ⚡</h1>

    <div class="menu-container">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>

      <div id="dropdownMenu" class="dropdown">
        <button onclick="goProfile()">👤 Profile</button>
        <button onclick="logout()">🚪 Logout</button>
      </div>
    </div>
  </div>

  <div id="homeControls" class="input-section">
    <input type="text" id="habitInput" placeholder="Enter habit to quit...">
    <button onclick="addHabit()">Add</button>
    <button onclick="toggleDarkMode()" id="themeBtn">🌙</button>
  </div>

  <div id="habitList"></div>

  <div id="detailView" style="display:none;">
    <button onclick="closeDetail()">⬅ Back</button>
    <h2 id="detailTitle"></h2>
    <canvas id="detailChart"></canvas>
    <div id="heatmap"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>

</body>
</html>
